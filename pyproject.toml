[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fleet-rightsizing"
version = "0.1.0"
description = "Public-data integration and illustrative fleet accounting with simulated mileage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Amirhossein Daneshpajouh" }]
keywords = ["fleet", "municipal", "emissions", "rightsizing", "zev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "mkdocs>=1.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
fleet-rightsizing = "fleet_rightsizing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_rightsizing"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"src/fleet_rightsizing/templates/report.html.j2" = "fleet_rightsizing/templates/report.html.j2"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fleet_rightsizing"]
mypy_path = "src"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["fleet_rightsizing"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that download data or run the full pipeline",
]
